<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Usage Dashboard</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>File Usage Dashboard</h1>
      <div class="actions">
        <label>
          Tidak dipakai sejak
          <select id="days">
            <option value="30">30 hari</option>
            <option value="60" selected>60 hari</option>
            <option value="90">90 hari</option>
            <option value="180">180 hari</option>
          </select>
        </label>
        <button id="refresh" type="button">Muat ulang</button>
      </div>
    </header>

    <section id="cards" class="cards"></section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>File</th>
            <th class="num">Ukuran</th>
            <th>Diunggah</th>
            <th>Akses terakhir</th>
            <th class="num">Akses</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty" hidden>Belum ada file di storage/uploads.</p>
    </section>

    <p id="error" class="error" hidden></p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
